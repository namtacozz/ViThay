name: Release LibMan for Windows & Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.5.0)'
        required: true
        default: 'v1.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR and LibMan.exe with Maven
        run: mvn clean package -DskipTests

      - name: Build Self-Contained Windows Portable Package (jpackage)
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "") { $ver = "1.5.0" }
          New-Item -ItemType Directory -Force "target/jpackage-input"
          Copy-Item "target/libman-1.0.0.jar" "target/jpackage-input/"
          jpackage --type app-image --name LibMan --input target/jpackage-input --main-jar libman-1.0.0.jar --main-class com.vithay.libman.Launcher --icon src/main/resources/com/vithay/libman/images/app_icon.ico --app-version $ver --vendor "ViThay"
          Compress-Archive -Path LibMan -DestinationPath LibMan-Windows-Portable-x64.zip

      - name: Prepare Release Assets
        run: |
          mkdir release-assets
          Copy-Item target/LibMan.exe release-assets/LibMan.exe
          Copy-Item target/libman-1.0.0.jar release-assets/libman-1.0.0.jar
          Copy-Item LibMan-Windows-Portable-x64.zip release-assets/LibMan-Windows-Portable-x64.zip
          Get-ChildItem release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.5.0' }}
          name: "LibMan Desktop Release ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.5.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 LibMan - Hệ Thống Quản Lý Thư Viện Hiện Đại (v1.5.0)

            Bản phát hành chính thức **v1.5.0** hoàn thiện toàn diện thiết kế giao diện theo tài liệu quy chuẩn B3 (Phân cấp trực quan, Dòng thị giác Trái-Phải & Trên-Dưới, Bố cục phân nhóm, Closable & Movable Panels), đồng thời sửa đổi kiến trúc nạp View độc lập và đóng gói đa nền tảng cho Windows 10/11 & Linux:

            ### 🌟 Các Cải Tiến Nổi Bật Trong Phiên Bản v1.5.0:
            - **Áp Dụng Trọn Vẹn 6 Nguyên Lý B3 Vào Giao Diện & Báo Cáo Chuyên Sâu:**
              - Bổ sung tài liệu phân tích công thái học chuẩn mực: `docs/bao-cao-phan-cap-truc-quan-va-bo-cuc.md`.
              - *Phân cấp trực quan:* Điểm rơi thị giác số 1 ở góc trên bên trái (Tiêu đề định danh, KPI Tổng Đầu Sách, Ô tìm kiếm nhanh).
              - *Dòng trực quan:* Quy trình Palette ➔ Canvas ➔ Chốt phiếu; Carousel sách nổi bật hỗ trợ lăn chuột ngang mượt mà.
              - *Phân nhóm chức năng:* Tách biệt Primary Action `[+ Thêm]` và Secondary Utility `[Xuất, Làm Mới]`; gom nhóm các card gợi ý `.inspector-branch-card`.
              - *Khung giao diện nhất quán:* App Shell 3 phân vùng ổn định, Design Tokens Dark / Pink-Light Theme, Toast thông báo nổi không chặn chuột.
              - *Closable Panel:* Nút đóng `[✕]` và nút toggle `[Chi tiết]` cho phép giải phóng 100% diện tích màn hình cho bảng sách.
              - *Movable & Resizable Panel:* Thanh chia SplitPane có hiệu ứng phát sáng khi hover; Nút `[Đổi bên]` bàn lưu hành; Toàn bộ các popup modal có thể kéo thả di chuyển tự do bằng thanh header (`UIUtils.makeDraggable`).
            - **Kiến Trúc Nạp View Cô Lập & Tối Ưu Tương Tác Chuột:**
              - Tách biệt từng khối nạp FXML độc lập trong `loadViews()`, loại bỏ hoàn toàn rủi ro một màn hình lỗi kéo theo toàn bộ ứng dụng bị tê liệt.
              - Tự động bật `mouseTransparent = true` khi popup overlay và tìm kiếm đóng, đảm bảo 100% các nút và bảng luôn click mượt mà.
            - **Bộ Kiểm Thử Tự Động Toàn Diện:**
              - 63/63 bài test JUnit 5 tự động vượt qua (100% BUILD SUCCESS).

            ---

            ### 📦 Các Bản Tải Về Cho Windows 11 / 10 & Linux:

            1. **`LibMan-Windows-Portable-x64.zip` (Khuyên Dùng Cho Windows 11 / 10):**
               - **Đã tích hợp sẵn Java Runtime (JRE 21)** bên trong.
               - Không cần cài thêm Java vào máy tính.
               - Cách dùng: Tải về, giải nén thư mục `LibMan` và nhấp đúp file **`LibMan.exe`** để chạy ngay.

            2. **`LibMan.exe` (File Thực Thi Độc Lập Cho Windows):**
               - Dành cho máy tính Windows 11 / 10 đã có sẵn Java 17+.
               - Nhấp đúp trực tiếp để mở giao diện ứng dụng.

            3. **`libman-1.0.0.jar` (File Chạy Đa Nền Tảng Cho Linux & Windows):**
               - Chạy trên Linux (Fedora, Ubuntu, Debian...) và Windows:
                 ```bash
                 java -jar libman-1.0.0.jar
                 ```

            ---

            ### ✨ Tính Năng Chính:
            - **2 Giao diện linh hoạt:** Spotify Dark Theme (mặc định) & Modern Bright Pink Theme (Light Mode).
            - **Phân quyền người dùng (RBAC):** Giám Đốc, Thủ Thư, Độc Giả.
            - **Tra cứu và tìm kiếm thông minh:** Hỗ trợ bộ gõ tiếng Việt Telex/VNI có dấu và gợi ý nhanh tức thì.
            - **Bộ lọc kho sách đa chiều:** Lọc theo thể loại, tác giả, trạng thái mượn và vị trí kệ sách.
            - **Cơ sở dữ liệu SQLite cục bộ:** Tự khởi tạo và lưu trữ an toàn, độc lập.
            - **56/56 Kiểm thử tự động:** JUnit 5 đạt 100% PASS.
          files: |
            release-assets/LibMan-Windows-Portable-x64.zip
            release-assets/LibMan.exe
            release-assets/libman-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
