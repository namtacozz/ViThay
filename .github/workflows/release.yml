name: Release LibMan for Windows & Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.3.2)'
        required: true
        default: 'v1.3.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR and LibMan.exe with Maven
        run: mvn clean package -DskipTests

      - name: Build Self-Contained Windows Portable Package (jpackage)
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "") { $ver = "1.3.2" }
          jpackage --type app-image --name LibMan --input target --main-jar libman-1.0.0.jar --main-class com.vithay.libman.Launcher --icon src/main/resources/com/vithay/libman/images/app_icon.ico --app-version $ver --vendor "ViThay"
          Compress-Archive -Path LibMan -DestinationPath LibMan-Windows-Portable-x64.zip

      - name: Prepare Release Assets
        run: |
          mkdir release-assets
          Copy-Item target/LibMan.exe release-assets/LibMan.exe
          Copy-Item target/libman-1.0.0.jar release-assets/libman-1.0.0.jar
          Copy-Item LibMan-Windows-Portable-x64.zip release-assets/LibMan-Windows-Portable-x64.zip
          Get-ChildItem release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.3.2' }}
          name: "LibMan Desktop Release ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.3.2' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 LibMan - Hệ Thống Quản Lý Thư Viện Hiện Đại (v1.3.2)

            Bản phát hành chính thức **v1.3.2** tối ưu hóa toàn diện cho Windows 10/11 & Linux với giao diện 60fps mượt mà, 100% bìa sách thật chính hãng và đầy đủ tính năng tra cứu mượn trả theo chuẩn SRS:

            ### 🌟 Các Cải Tiến Nổi Bật Trong Phiên Bản v1.3.2:
            - **100% Bìa Sách Thật Từ Web & Nhà Xuất Bản:**
              - Tải trực tiếp từ NXB Chính Trị Quốc Gia Sự Thật, NXB Văn Học, NXB Kim Đồng, NXB Trẻ, Tiki CDN...
              - Xóa bỏ hoàn toàn 100% bìa sách giả lập / placeholder màu xanh, ảnh độ phân giải cao và kích thước thật (>= 15KB).
              - Sửa triệt để lỗi bìa lệch nội dung (Tư Tưởng HCM, Đồi Gió Hú, Toán Rời Rạc, Số Đỏ, Kim Dung, Thích Nhất Hạnh...).
            - **Trang Chủ Dashboard Siêu Mượt 60fps & Lời Chào Ngữ Cảnh:**
              - Triệt tiêu hoàn toàn hiện tượng lag khi rê chuột hover vào các thẻ dashboard nhờ tối ưu hóa CSS selector và bộ nhớ đệm cache ảnh.
              - Lời chào đồng bộ thời gian thực: Hiển thị tự nhiên *"Xin chào!"* khi chưa đăng nhập và *"Xin chào, [Họ và tên]!"* khi đã đăng nhập (không còn bị gán cứng "Minh Trí").
              - Dải 15 sách nổi bật với thanh cuộn mượt riêng biệt; Bảng 28 giao dịch gần đây tự co giãn vừa vặn khung hình (responsive fit).
            - **Cơ Chế Khám Phá An Toàn (Safe Exploration):**
              - **Click đơn (Single-click) hoặc phím mũi tên:** Chỉ xem trước nhanh (Preview) ở bảng chi tiết bên phải (Inspector) mà không nhảy màn hình.
              - **Click đúp (Double-click) hoặc phím Enter:** Mở giao diện xem chi tiết chuyên sâu toàn màn hình (Full Detail Modal).
            - **Modal Hướng Dẫn (SRS) Nội Bộ Hiện Đại (In-App Modal):**
              - Mở ngay trong ứng dụng với hiệu ứng nền mờ GaussianBlur thay vì mở cửa sổ desktop riêng lẻ.
              - Trình bày trực quan theo từng vai trò (Giám đốc, Thủ thư, Độc giả) kèm phím tắt **Esc** đóng nhanh.
            - **Form Đổi Mật Khẩu Thu Gọn (Collapsible Toggle):**
              - Tích hợp nút toggle *"🔑 Đổi mật khẩu ▾"* giúp giao diện cài đặt và thông tin cá nhân luôn tinh gọn, giảm tải nhận thức.
            - **Sidebar & Icon Cân Đối Hoàn Hảo:**
              - Cân đối hình học tâm icon khi thu gọn và mở rộng, độ tương phản cao trên cả Spotify Dark Theme và Modern Pink Light Theme.
            - **Bộ Kiểm Thử Tự Động Toàn Diện:**
              - 56 bài test JUnit 5 tự động bao phủ 100% luồng nghiệp vụ và UI logic, đạt tỷ lệ vượt qua 100% (56/56 PASS).

            ---

            ### 📦 Các Bản Tải Về Cho Windows 11 / 10 & Linux:

            1. **`LibMan-Windows-Portable-x64.zip` (Khuyên Dùng Cho Windows 11 / 10):**
               - **Đã tích hợp sẵn Java Runtime (JRE 21)** bên trong.
               - Không cần cài thêm Java vào máy tính.
               - Cách dùng: Tải về, giải nén thư mục `LibMan` và nhấp đúp file **`LibMan.exe`** để chạy ngay.

            2. **`LibMan.exe` (File Thực Thi Độc Lập Cho Windows):**
               - Dành cho máy tính Windows 11 / 10 đã có sẵn Java 17+.
               - Nhấp đúp trực tiếp để mở giao diện ứng dụng.

            3. **`libman-1.0.0.jar` (File Chạy Đa Nền Tảng Cho Linux & Windows):**
               - Chạy trên Linux (Fedora, Ubuntu, Debian...) và Windows:
                 ```bash
                 java -jar libman-1.0.0.jar
                 ```

            ---

            ### ✨ Tính Năng Chính:
            - **2 Giao diện linh hoạt:** Spotify Dark Theme (mặc định) & Modern Bright Pink Theme (Light Mode).
            - **Phân quyền người dùng (RBAC):** Giám Đốc, Thủ Thư, Độc Giả.
            - **Tra cứu và tìm kiếm thông minh:** Hỗ trợ bộ gõ tiếng Việt Telex/VNI có dấu và gợi ý nhanh tức thì.
            - **Bộ lọc kho sách đa chiều:** Lọc theo thể loại, tác giả, trạng thái mượn và vị trí kệ sách.
            - **Cơ sở dữ liệu SQLite cục bộ:** Tự khởi tạo và lưu trữ an toàn, độc lập.
            - **56/56 Kiểm thử tự động:** JUnit 5 đạt 100% PASS.
          files: |
            release-assets/LibMan-Windows-Portable-x64.zip
            release-assets/LibMan.exe
            release-assets/libman-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
