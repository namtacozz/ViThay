name: Release LibMan for Windows & Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR and LibMan.exe with Maven
        run: mvn clean package -DskipTests

      - name: Build Self-Contained Windows Portable Package (jpackage)
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "") { $ver = "1.4.0" }
          jpackage --type app-image --name LibMan --input target --main-jar libman-1.0.0.jar --main-class com.vithay.libman.Launcher --icon src/main/resources/com/vithay/libman/images/app_icon.ico --app-version $ver --vendor "ViThay"
          Compress-Archive -Path LibMan -DestinationPath LibMan-Windows-Portable-x64.zip

      - name: Prepare Release Assets
        run: |
          mkdir release-assets
          Copy-Item target/LibMan.exe release-assets/LibMan.exe
          Copy-Item target/libman-1.0.0.jar release-assets/libman-1.0.0.jar
          Copy-Item LibMan-Windows-Portable-x64.zip release-assets/LibMan-Windows-Portable-x64.zip
          Get-ChildItem release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.4.0' }}
          name: "LibMan Desktop Release ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.4.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 LibMan - Hệ Thống Quản Lý Thư Viện Hiện Đại (v1.4.0)

            Bản phát hành chính thức **v1.4.0** tối ưu hóa toàn diện cho Windows 10/11 & Linux với giao diện in-app overlay hiện đại, bảo mật phân quyền RBAC chặt chẽ và trải nghiệm mượt mà theo chuẩn SRS:

            ### 🌟 Các Cải Tiến Nổi Bật Trong Phiên Bản v1.4.0:
            - **Hệ Thống In-App Popup Overlay Độc Quyền (Không Cửa Sổ Phụ):**
              - Triệt tiêu 100% các hộp thoại native OS (`new Alert`, `new Dialog`), thay thế bằng `appNoticeModalBox` với hiệu ứng làm mờ nền `GaussianBlur(14)`.
              - Thông báo và nhắc nhở phân cấp trực quan: Thành công (`✓`), Cảnh báo (`⚠`), Lỗi (`✕`), Xác nhận (`?`), Yêu cầu đăng nhập (`🔒`).
              - Khi người dùng chưa đăng nhập bấm mượn sách hoặc gửi bình luận: Hiển thị ngay popup modal yêu cầu đăng nhập kèm nút *"Đăng Nhập Ngay"* và *"Để Sau"*.
              - Xem trước mẫu phiếu in (Borrow Slip / Receipt) trực tiếp trong popup in-app không sinh cửa sổ phụ Desktop.
            - **Phân Định Trải Nghiệm Độc Giả & Bảo Vệ Quyền Hạn (RBAC):**
              - Độc giả có cửa sổ modal lập phiếu mượn riêng biệt (`readerBorrowModalBox`), không còn truy cập nhầm vào bàn lưu hành của thủ thư/admin.
              - Độc giả chỉ xem lịch sử phiếu mượn của chính mình; phân quyền chặt chẽ giữa Độc Giả, Thủ Thư và Giám Đốc.
            - **Đồng Nhất Mã Giao Dịch Tuần Tự Chuẩn Thư Viện (`2112xxxxx`):**
              - Xóa bỏ hoàn toàn mã mượn sách ngẫu nhiên dạng `TX1790...`.
              - Tự động sinh mã tuần tự 9 chữ số chuẩn (`211200029`, `211200030`, `211200031`...) cho mọi hình thức mượn sách.
            - **Hợp Nhất Trợ Lý Mượn Nhanh Vào Bàn Lưu Hành (Desk):**
              - Tinh gọn sidebar điều hướng: Tích hợp nút chuyển đổi `[⚡ Trợ lý mượn nhanh (Wizard)]` màu xanh lá ở góc trên bên phải Bàn lưu hành.
              - Cho phép chuyển đổi linh hoạt 1-click qua lại giữa Bàn lưu hành tiêu chuẩn (Desk) và Trợ lý từng bước (Wizard).
            - **Tương Tác Kho Sách Dạng Lưới Thẻ (Grid View):**
              - Hỗ trợ click đúp (Double-click) hoặc phím Enter trên từng thẻ sách ở chế độ Grid View để mở giao diện toàn màn hình chi tiết sách.
            - **Chuẩn Hóa Hồ Sơ Độc Giả "Trần Văn An" & Cách Ly Dữ Liệu Test:**
              - Khôi phục tài khoản `docgia` và thẻ thư viện `DG001` về họ tên chuẩn: **Trần Văn An**.
              - Cô lập toàn diện các bài test tự động JUnit 5 với teardown khôi phục dữ liệu nguyên trạng, không gây ô nhiễm DB.
            - **Cập Nhật 100% Bìa Sách Thật Chính Hãng:**
              - Sửa đúng bìa cho Doraemon, Conan, Kính Vạn Hoa và toàn bộ 221 đầu sách trong kho.
            - **Bộ Kiểm Thử Tự Động Toàn Diện:**
              - 62/62 bài test JUnit 5 tự động vượt qua (100% BUILD SUCCESS).

            ---

            ### 📦 Các Bản Tải Về Cho Windows 11 / 10 & Linux:

            1. **`LibMan-Windows-Portable-x64.zip` (Khuyên Dùng Cho Windows 11 / 10):**
               - **Đã tích hợp sẵn Java Runtime (JRE 21)** bên trong.
               - Không cần cài thêm Java vào máy tính.
               - Cách dùng: Tải về, giải nén thư mục `LibMan` và nhấp đúp file **`LibMan.exe`** để chạy ngay.

            2. **`LibMan.exe` (File Thực Thi Độc Lập Cho Windows):**
               - Dành cho máy tính Windows 11 / 10 đã có sẵn Java 17+.
               - Nhấp đúp trực tiếp để mở giao diện ứng dụng.

            3. **`libman-1.0.0.jar` (File Chạy Đa Nền Tảng Cho Linux & Windows):**
               - Chạy trên Linux (Fedora, Ubuntu, Debian...) và Windows:
                 ```bash
                 java -jar libman-1.0.0.jar
                 ```

            ---

            ### ✨ Tính Năng Chính:
            - **2 Giao diện linh hoạt:** Spotify Dark Theme (mặc định) & Modern Bright Pink Theme (Light Mode).
            - **Phân quyền người dùng (RBAC):** Giám Đốc, Thủ Thư, Độc Giả.
            - **Tra cứu và tìm kiếm thông minh:** Hỗ trợ bộ gõ tiếng Việt Telex/VNI có dấu và gợi ý nhanh tức thì.
            - **Bộ lọc kho sách đa chiều:** Lọc theo thể loại, tác giả, trạng thái mượn và vị trí kệ sách.
            - **Cơ sở dữ liệu SQLite cục bộ:** Tự khởi tạo và lưu trữ an toàn, độc lập.
            - **56/56 Kiểm thử tự động:** JUnit 5 đạt 100% PASS.
          files: |
            release-assets/LibMan-Windows-Portable-x64.zip
            release-assets/LibMan.exe
            release-assets/libman-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
