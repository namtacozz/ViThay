name: Release LibMan for Windows & Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR and LibMan.exe with Maven
        run: mvn clean package -DskipTests

      - name: Build Self-Contained Windows Portable Package (jpackage)
        run: |
          jpackage --type app-image --name LibMan --input target --main-jar libman-1.0.0.jar --main-class com.vithay.libman.Launcher --icon src/main/resources/com/vithay/libman/images/app_icon.ico --app-version 1.1.0 --vendor "ViThay"
          Compress-Archive -Path LibMan -DestinationPath LibMan-Windows-Portable-x64.zip

      - name: Prepare Release Assets
        run: |
          mkdir release-assets
          Copy-Item target/LibMan.exe release-assets/LibMan.exe
          Copy-Item target/libman-1.0.0.jar release-assets/libman-1.0.0.jar
          Copy-Item LibMan-Windows-Portable-x64.zip release-assets/LibMan-Windows-Portable-x64.zip
          Get-ChildItem release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.1.0' }}
          name: "LibMan Desktop Release ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.1.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 LibMan - Hệ Thống Quản Lý Thư Viện Hiện Đại (v1.1.0)

            Bản phát hành **v1.1.0** tích hợp toàn diện **7 Mẫu Thiết Kế Cấu Trúc Vật Lý & Thông Tin (Interaction Design Patterns - Jenifer Tidwell)**:
            - **Two-Panel Selector:** Master-Detail SplitPane với Detail Inspector thời gian thực trong Kho Sách.
            - **Canvas Plus Palette:** Bàn Lưu Hành trực quan gồm Palette chọn sách (30%) và Canvas cấu hình mượn trả (70%).
            - **One-Window Drilldown:** Breadcrumb phân cấp và tra cứu lịch sử mượn trả in-place không cần mở modal.
            - **Alternative Views:** Chuyển đổi linh hoạt giữa Chế độ Bảng (Table) và Chế độ Thẻ Spotify Card Grid.
            - **Wizard:** Trợ lý lập phiếu mượn 4 bước tuần tự với chốt chặn kiểm soát thẻ & trần hạn ngạch 5 cuốn (SRS 6.1).
            - **Extras on Demand:** Khung lọc nâng cao và ngăn tra cứu quy chế/chế tài thu gọn linh hoạt.
            - **Intriguing Branches:** Gợi ý sách cùng kệ/cùng tác giả & banner cảnh báo hạn trả tự động.

            ---

            ### 📦 Các Bản Tải Về Cho Windows 11 / 10 & Linux:

            1. **`LibMan-Windows-Portable-x64.zip` (Khuyên Dùng Cho Windows 11 / 10):**
               - **Đã tích hợp sẵn Java Runtime (JRE 21)** bên trong.
               - Không cần cài thêm Java vào máy tính.
               - Cách dùng: Tải về, giải nén thư mục `LibMan` và nhấp đúp file **`LibMan.exe`** để chạy ngay.

            2. **`LibMan.exe` (File Thực Thi Độc Lập Cho Windows):**
               - Dành cho máy tính Windows 11 / 10 đã có sẵn Java 17+.
               - Nhấp đúp trực tiếp để mở giao diện ứng dụng.

            3. **`libman-1.0.0.jar` (File Chạy Đa Nền Tảng Cho Linux & Windows):**
               - Chạy trên Linux (Fedora, Ubuntu, Debian...) và Windows:
                 ```bash
                 java -jar libman-1.0.0.jar
                 ```

            ---

            ### ✨ Tính Năng Nổi Bật:
            - **2 Giao diện linh hoạt:** Spotify Dark Theme (mặc định) & Modern Bright Pink Theme (Light Mode).
            - **Phân quyền người dùng (RBAC):** Giám Đốc, Thủ Thư, Độc Giả.
            - **Tra cứu và tìm kiếm thông minh:** Hỗ trợ bộ gõ tiếng Việt Telex/VNI có dấu và gợi ý nhanh tức thì.
            - **Bộ lọc kho sách đa chiều:** Lọc theo thể loại, tác giả và trạng thái mượn sách.
            - **Cơ sở dữ liệu SQLite cục bộ:** Tự khởi tạo và lưu trữ an toàn, độc lập.
            - **Kiểm thử tự động:** 39 bài test tự động JUnit 5 đạt tỷ lệ vượt qua 100%.
          files: |
            release-assets/LibMan-Windows-Portable-x64.zip
            release-assets/LibMan.exe
            release-assets/libman-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
