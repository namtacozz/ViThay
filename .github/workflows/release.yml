name: Release LibMan for Windows & Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Fat JAR and LibMan.exe with Maven
        run: mvn clean package -DskipTests

      - name: Build Self-Contained Windows Portable Package (jpackage)
        run: |
          jpackage --type app-image --name LibMan --input target --main-jar libman-1.0.0.jar --main-class com.vithay.libman.Launcher --icon src/main/resources/com/vithay/libman/images/app_icon.ico --app-version 1.3.0 --vendor "ViThay"
          Compress-Archive -Path LibMan -DestinationPath LibMan-Windows-Portable-x64.zip

      - name: Prepare Release Assets
        run: |
          mkdir release-assets
          Copy-Item target/LibMan.exe release-assets/LibMan.exe
          Copy-Item target/libman-1.0.0.jar release-assets/libman-1.0.0.jar
          Copy-Item LibMan-Windows-Portable-x64.zip release-assets/LibMan-Windows-Portable-x64.zip
          Get-ChildItem release-assets/

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.3.0' }}
          name: "LibMan Desktop Release ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.3.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 LibMan - Hệ Thống Quản Lý Thư Viện Hiện Đại (v1.3.0)

            Bản phát hành **v1.3.0** nâng cấp vượt bậc về trải nghiệm người dùng, đồ họa vector, bố cục tự co giãn và kho tư liệu 221 cuốn sách bìa thật:
            - **Trang Chủ Responsive & Bố Cục Thông Minh:**
              - Tách riêng thanh cuộn ngang độc quyền cho hàng "Sách Nổi Bật".
              - Cố định toàn màn hình, nút "+ Lập phiếu mượn" và "Làm mới" luôn hiển thị trọn vẹn trong tầm mắt.
              - Bảng giao dịch gần đây tự động scale đầy đủ độ rộng cửa sổ khi phóng to/thu nhỏ.
            - **Sidebar Dọc Phong Cách Brave Browser (Vertical Tabs):**
              - Chế độ mặc định thu nhỏ 64px chỉ hiện icon vector tinh gọn.
              - Tự động trượt mở rộng 250px kèm nhãn chữ khi rê chuột vào (hover) và co lại khi rời chuột.
              - Tích hợp nút Ghim (Pin) giúp người dùng linh hoạt khóa mở rộng hoặc cho phép tự co giãn.
            - **Hệ Thống Icon Vector SVG Toàn Diện (Morphicons / Lucide):**
              - 100% icon chuyển thành vector SVG mượt mà, đổi màu chuẩn theo Spotify Dark Theme (#1DB954) và Pink Light Theme (#E91E63).
              - Loại bỏ cắt chữ trên các nút chuyển đổi Bảng / Lưới thẻ bằng icon vector và Tooltip chỉ dẫn.
            - **Kho 221 Cuốn Sách Với Bìa Thật & Phân Bố Theo Tác Giả Lớn:**
              - Bổ sung hơn 221 đầu sách phân bổ đậm đặc cho các tác giả lớn (Nguyễn Nhật Ánh: 17 cuốn, Haruki Murakami: 12 cuốn, J.K. Rowling: 11 cuốn, Kim Dung: 10 cuốn, Arthur Conan Doyle: 10 cuốn, Agatha Christie: 10 cuốn, Thích Nhất Hạnh: 8 cuốn, Paulo Coelho: 8 cuốn, Dan Brown: 7 cuốn, Yuval Noah Harari: 6 cuốn, Walter Isaacson: 6 cuốn, Stephen Hawking: 6 cuốn, Stephen King: 6 cuốn, Robert C. Martin: 6 cuốn, v.v.).
              - 100% bìa sách chính xác, sắc nét tải trực tiếp từ Open Library.
            - **Đồng Bộ Hóa 100% Tiếng Việt Cho Toàn Bộ Bộ Lọc & Trạng Thái:**
              - Dropdown lọc trạng thái: "Tất cả", "Còn sách", "Đang mượn", "Tạm giữ".
              - Bộ lọc tồn kho: "Tất cả", "Còn sách", "Hết sách".
              - Bộ lọc độc giả: "Tất cả", "Hoạt Động", "Chờ Cấp Thẻ", "Bị Khóa", "Hết Hạn".
              - Toàn bộ modal Thêm/Sửa sách và Độc giả hiển thị tiếng Việt hoàn toàn.
            - **Kiểm thử tự động:** 48 bài test tự động JUnit 5 đạt tỷ lệ vượt qua 100%.

            ---

            ### 📦 Các Bản Tải Về Cho Windows 11 / 10 & Linux:

            1. **`LibMan-Windows-Portable-x64.zip` (Khuyên Dùng Cho Windows 11 / 10):**
               - **Đã tích hợp sẵn Java Runtime (JRE 21)** bên trong.
               - Không cần cài thêm Java vào máy tính.
               - Cách dùng: Tải về, giải nén thư mục `LibMan` và nhấp đúp file **`LibMan.exe`** để chạy ngay.

            2. **`LibMan.exe` (File Thực Thi Độc Lập Cho Windows):**
               - Dành cho máy tính Windows 11 / 10 đã có sẵn Java 17+.
               - Nhấp đúp trực tiếp để mở giao diện ứng dụng.

            3. **`libman-1.0.0.jar` (File Chạy Đa Nền Tảng Cho Linux & Windows):**
               - Chạy trên Linux (Fedora, Ubuntu, Debian...) và Windows:
                 ```bash
                 java -jar libman-1.0.0.jar
                 ```

            ---

            ### ✨ Tính Năng Nổi Bật:
            - **2 Giao diện linh hoạt:** Spotify Dark Theme (mặc định) & Modern Bright Pink Theme (Light Mode).
            - **Phân quyền người dùng (RBAC):** Giám Đốc, Thủ Thư, Độc Giả.
            - **Tra cứu và tìm kiếm thông minh:** Hỗ trợ bộ gõ tiếng Việt Telex/VNI có dấu và gợi ý nhanh tức thì.
            - **Bộ lọc kho sách đa chiều:** Lọc theo thể loại, tác giả và trạng thái mượn sách.
            - **Cơ sở dữ liệu SQLite cục bộ:** Tự khởi tạo và lưu trữ an toàn, độc lập.
            - **Kiểm thử tự động:** 48 bài test tự động JUnit 5 đạt tỷ lệ vượt qua 100%.
          files: |
            release-assets/LibMan-Windows-Portable-x64.zip
            release-assets/LibMan.exe
            release-assets/libman-1.0.0.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
